<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSL-Translator</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; }
        #stream { max-width: 100%; border: 1px solid #ccc; }
        #pred { font-size: 1.4em; font-weight: bold; }
        #sentence { font-size: 1.2em; background: #f4f4f4; padding: 8px; min-height: 1.5em; }
        #smart { font-size: 1.2em; background: #eef6ff; padding: 8px; min-height: 1.5em; }
        .row { display: flex; gap: 8px; margin: 8px 0; }
    </style>
</head>
<body>
    <h1>VSL-Translator</h1>
    <div class="row">
        <button id="startBtn">Bắt đầu nhận diện</button>
        <button id="stopBtn">Dừng</button>
        <label><input type="checkbox" id="debugChk"> Debug landmark</label>
    </div>
    <img id="stream" alt="video stream — bấm Bắt đầu để mở camera" />
    <p id="streamHint">Camera đang tắt. Bấm "Bắt đầu nhận diện" để mở.</p>
    <p>Status: <span id="status">...</span> | Buffer: <span id="buffer">...</span></p>
    <p>Dự đoán: <span id="pred">...</span></p>
    <p>Câu:</p>
    <div id="sentence"></div>
    <p>Câu smart (Groq <span id="groqModel">...</span>):</p>
    <div id="smart"></div>
    <div class="row">
        <button id="smartRetryBtn">Thử lại smart</button>
    </div>
    <div class="row">
        <button id="backspaceBtn">Xóa từ cuối</button>
        <button id="clearBtn">Xóa cả câu</button>
    </div>

    <hr>
    <h2>Cài đặt</h2>
    <p>Groq API key: <span id="groqStatus">...</span></p>
    <div class="row">
        <input type="password" id="groqKey" placeholder="gsk_..." size="40" autocomplete="off" />
        <button id="saveKeyBtn">Lưu key</button>
    </div>
    <p id="keyMsg"></p>

    <hr>
    <button id="testBtn">Gọi test()</button>
    <p id="result"></p>

    <script>
        async function refreshState() {
            try {
                const res = await fetch("/api/state");
                const s = await res.json();
                document.getElementById("status").textContent = s.status || "-";
                document.getElementById("buffer").textContent = s.buffer || "-";
                document.getElementById("pred").textContent =
                    s.pred ? `${s.pred} (${(s.conf * 100).toFixed(1)}%)` : "(chưa có)";
                document.getElementById("sentence").textContent =
                    (s.sentence || []).join(" ");
                document.getElementById("smart").textContent =
                    s.smart_error ? `(smart lỗi: ${s.smart_error})`
                    : s.smart ? s.smart
                    : s.smart_pending ? "(smart: ...)" : "(smart: trống)";
                if (s.groq_model) document.getElementById("groqModel").textContent = s.groq_model;
                if ("groq_configured" in s) document.getElementById("groqStatus").textContent =
                    s.groq_configured ? "đã cấu hình" : "chưa có — smart sẽ báo lỗi";
                document.getElementById("startBtn").disabled = !!s.inferring;
                document.getElementById("stopBtn").disabled = !s.inferring;
            } catch (e) { /* server/camera chưa sẵn sàng */ }
        }
        setInterval(refreshState, 500);
        refreshState();

        async function sentenceAction(action) {
            const res = await fetch("/api/sentence", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action })
            });
            const s = await res.json();
            if (s.sentence) document.getElementById("sentence").textContent = s.sentence.join(" ");
        }
        document.getElementById("backspaceBtn").addEventListener("click", () => sentenceAction("backspace"));
        document.getElementById("clearBtn").addEventListener("click", () => sentenceAction("clear"));
        document.getElementById("smartRetryBtn").addEventListener("click", async () => {
            const res = await fetch("/api/smart", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "retry" })
            });
            const s = await res.json();
            if (s.ok) refreshState();
            else document.getElementById("smart").textContent = `(smart: ${s.error})`;
        });

        async function inferenceAction(action) {
            const body = { action };
            if (action === "start") {
                body.debug = document.getElementById("debugChk").checked;
            }
            const res = await fetch("/api/inference", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const s = await res.json();
            const stream = document.getElementById("stream");
            const hint = document.getElementById("streamHint");
            if (s.ok && action === "start") {
                // Gắn stream khi và chỉ khi bấm Bắt đầu → camera mới mở.
                stream.src = "/video";
                hint.style.display = "none";
                stream.style.display = "";
            } else if (action === "stop") {
                // Ngắt stream → server dừng vòng lặp, release camera ngay.
                stream.removeAttribute("src");
                stream.style.display = "none";
                hint.style.display = "";
            }
            if (s.ok) refreshState();
        }
        document.getElementById("startBtn").addEventListener("click", () => inferenceAction("start"));
        document.getElementById("stopBtn").addEventListener("click", () => inferenceAction("stop"));

        document.getElementById("saveKeyBtn").addEventListener("click", async () => {
            const key = document.getElementById("groqKey").value.trim();
            const msg = document.getElementById("keyMsg");
            if (!key) { msg.textContent = "Nhập key trước khi lưu."; return; }
            msg.textContent = "Đang lưu...";
            try {
                const res = await fetch("/api/config", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "set_groq_key", key })
                });
                const data = await res.json();
                if (data.ok || data.groq_configured) {
                    msg.textContent = "Đã lưu key vào backend/.env — có hiệu lực ngay.";
                    document.getElementById("groqKey").value = "";
                    refreshState();
                } else {
                    msg.textContent = `(lỗi: ${data.error || "không lưu được"})`;
                }
            } catch (e) { msg.textContent = `(lỗi mạng: ${e})`; }
        });

        document.getElementById("testBtn").addEventListener("click", async () => {
            const res = await fetch("/api/test", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ info: "hello from index.html" })
            });
            const data = await res.json();
            document.getElementById("result").textContent = JSON.stringify(data);
        });
    </script>
</body>
</html>
