<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VSL Remote Camera</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #111; color: #eee; text-align: center; }
  video { width: 100%; max-height: 55vh; background: #000; }
  #status { font-size: 1.4em; margin: 12px; min-height: 2em; }
  #sentence { font-size: 1.1em; color: #8f8; margin: 8px; min-height: 1.5em; }
  .row { margin: 8px; }
  input { width: 70%; padding: 6px; }
  button { padding: 10px 18px; font-size: 1em; margin: 4px; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<div id="status">Chua ket noi</div>
<div id="sentence"></div>
<div class="row">
  <input id="url" value="" placeholder="ws://SERVER_IP:8765">
</div>
<div class="row">
  <button id="start">Bat camera + ket noi</button>
  <button id="stop">Dung</button>
</div>
<canvas id="buf" width="640" height="640" style="display:none"></canvas>
<script>
let ws = null, stream = null, timer = null;
const video = document.getElementById('cam');
const status = document.getElementById('status');
const sentence = document.getElementById('sentence');
const canvas = document.getElementById('buf');
const ctx = canvas.getContext('2d');

document.getElementById('start').onclick = async () => {
  const url = document.getElementById('url').value.trim();
  if (!url) { status.textContent = 'Nhap dia chi server'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
  } catch (e) { status.textContent = 'Khong mo duoc camera: ' + e; return; }
  ws = new WebSocket(url);
  ws.onopen = () => {
    status.textContent = 'Da ket noi, dang gui frame...';
    timer = setInterval(sendFrame, 100); // ~10 fps
  };
  ws.onmessage = (ev) => {
    try {
      const d = JSON.parse(ev.data);
      status.textContent = d.pred ? (d.pred + ' (' + (d.conf * 100).toFixed(1) + '%)') : 'Dang nhan dien...';
      sentence.textContent = (d.sentence || []).join(' ');
    } catch (e) {}
  };
  ws.onclose = () => { status.textContent = 'Mat ket noi'; stopSending(); };
  ws.onerror = () => { status.textContent = 'Loi ket noi'; };
};
function sendFrame() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (video.videoWidth === 0) return;
  // letterbox to square 640
  const s = 640, vw = video.videoWidth, vh = video.videoHeight;
  const scale = s / Math.max(vw, vh);
  const nw = Math.round(vw * scale), nh = Math.round(vh * scale);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, s, s);
  ctx.drawImage(video, (s - nw) / 2, (s - nh) / 2, nw, nh);
  canvas.toBlob((b) => { if (b && ws.readyState === WebSocket.OPEN) ws.send(b); }, 'image/jpeg', 0.7);
}
function stopSending() { if (timer) { clearInterval(timer); timer = null; } }
document.getElementById('stop').onclick = () => {
  stopSending();
  if (ws) { ws.close(); ws = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  status.textContent = 'Da dung';
};
</script>
</body>
</html>
